services:
  - type: web
    name: shopkeeper-backend
    env: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3000
      - key: MONGO_URI
        sync: false
        placeholder: "Enter your MongoDB connection string"
      - key: JWT_SECRET
        sync: false
        placeholder: "Enter your JWT secret key"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
        placeholder: "Enter your Cloudinary Cloud Name"
      - key: CLOUDINARY_API_KEY
        sync: false
        placeholder: "Enter your Cloudinary API Key"
      - key: CLOUDINARY_API_SECRET
        sync: false
        placeholder: "Enter your Cloudinary API Secret"
